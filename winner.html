<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Retro Family Feud — Winner</title>
<style>
:root{--pink:#ff0b8f;--purple:#7b2cff;--cyan:#21c7ff;--orange:#ff7a00;--yellow:#ffd51f;--white:#fff8ff;--bg:#08030d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--white);overflow:hidden}
body{background:radial-gradient(circle at 50% 25%,rgba(255,11,143,.34),transparent 33%),radial-gradient(circle at 20% 70%,rgba(123,44,255,.24),transparent 30%),radial-gradient(circle at 80% 60%,rgba(33,199,255,.18),transparent 28%),linear-gradient(180deg,#120316,#25052b 52%,#06030a 100%)}
body:before{content:"";position:fixed;inset:0;opacity:.45;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px),radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:90px 90px,130px 130px;background-position:0 0,48px 22px;pointer-events:none}
body:after{content:"";position:fixed;left:-10%;right:-10%;bottom:-10vh;height:45vh;background-image:linear-gradient(rgba(33,199,255,.7) 2px,transparent 2px),linear-gradient(90deg,rgba(33,199,255,.7) 2px,transparent 2px);background-size:56px 42px;transform:perspective(460px) rotateX(62deg);transform-origin:bottom;opacity:.65;pointer-events:none}
.wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(1050px,92vw);text-align:center;padding:48px 42px 44px;border-radius:34px;background:linear-gradient(180deg,rgba(50,13,70,.94),rgba(17,6,27,.96));border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 4px rgba(255,11,143,.9),0 0 0 8px rgba(33,199,255,.35),0 0 70px rgba(255,11,143,.35),0 0 110px rgba(33,199,255,.18);position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 18%);animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.kicker{position:relative;font-weight:1000;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-size:clamp(16px,2vw,24px)}.winner{position:relative;margin:18px auto 6px;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-size:clamp(68px,12vw,150px);line-height:.9;background:linear-gradient(180deg,#fff 4%,#ffe99a 28%,var(--yellow) 48%,var(--orange) 70%,var(--pink) 92%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,213,31,.32));text-transform:uppercase}.score{position:relative;font-size:clamp(28px,4vw,52px);font-weight:950;letter-spacing:.04em}.sub{position:relative;margin-top:12px;color:#d9c8e1;font-size:clamp(14px,1.7vw,20px);font-weight:800}.close{position:relative;margin-top:28px;padding:12px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;cursor:pointer}
canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;pointer-events:none}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap"><div class="card"><div class="kicker">AND THE WINNER IS</div><div class="winner" id="team">TEAM A</div><div class="score" id="score">0 POINTS</div><div class="sub" id="detail"></div><button class="close" onclick="window.close()">Close Winner Screen</button></div></div>
<script>
const p=new URLSearchParams(location.search);const team=p.get('team')||'TIE GAME';const score=p.get('score')||'0 - 0';const a=p.get('a')||'0',b=p.get('b')||'0',ta=p.get('teamA')||'TEAM A',tb=p.get('teamB')||'TEAM B';document.getElementById('team').textContent=team;document.getElementById('score').textContent=score;document.getElementById('detail').textContent=`FINAL SCORE: ${ta} ${a} • ${tb} ${b}`;
const AC=window.AudioContext||window.webkitAudioContext;let ctx;function tone(f,d,t='triangle',g=.05){try{ctx=ctx||new AC();const o=ctx.createOscillator(),v=ctx.createGain();o.type=t;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(ctx.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}function winSound(){tone(523,.42,'triangle',.07);setTimeout(()=>tone(659,.45,'triangle',.075),220);setTimeout(()=>tone(784,.48,'triangle',.08),440);setTimeout(()=>tone(1047,.7,'triangle',.08),680);setTimeout(()=>tone(1319,.95,'triangle',.07),980)}
const c=document.getElementById('confetti'),x=c.getContext('2d');let W,H,parts=[];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);const cols=['#ff0b8f','#7b2cff','#21c7ff','#ff7a00','#ffd51f','#ffffff'];for(let i=0;i<220;i++)parts.push({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,w:5+Math.random()*9,h:9+Math.random()*15,vy:2.2+Math.random()*4.8,vx:-1.8+Math.random()*3.6,r:Math.random()*6.28,vr:-.13+Math.random()*.26,c:cols[(Math.random()*cols.length)|0]});function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>innerHeight+30){p.y=-20;p.x=Math.random()*innerWidth}x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);winSound();
</script>
</body></html>
